<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 종목 뉴스 알림</title>
<style>
  :root{
    --bg: #10120f;
    --panel: #181b17;
    --panel-border: #2a2e28;
    --ink: #ece8de;
    --ink-dim: #9a9c8f;
    --amber: #c99a3a;
    --amber-dim: #8a6f38;
    --green: #7fa66b;
    --serif: 'Iowan Old Style','Palatino Linotype', Georgia, 'Noto Serif KR', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height:100vh;
    line-height:1.5;
  }
  header{
    padding: 48px 24px 28px;
    max-width: 860px;
    margin: 0 auto;
    border-bottom: 1px solid var(--panel-border);
  }
  header .eyebrow{
    color: var(--amber);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  header h1{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 34px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  header p{
    color: var(--ink-dim);
    font-size: 14.5px;
    margin: 0;
    max-width: 520px;
  }
  main{
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom: 28px;
  }
  .chip{
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--ink-dim);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    font-family: var(--sans);
  }
  .chip:hover{ color: var(--ink); border-color: var(--amber-dim); }
  .chip.active{
    color: var(--bg);
    background: var(--amber);
    border-color: var(--amber);
    font-weight: 600;
  }
  .day-group{ margin-bottom: 30px; }
  .day-label{
    font-size: 12.5px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--panel-border);
  }
  .alert-item{
    display:flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #1d201b;
  }
  .alert-item:last-child{ border-bottom: none; }
  .alert-time{
    flex: 0 0 52px;
    color: var(--ink-dim);
    font-size: 12.5px;
    padding-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .alert-body{ flex: 1; min-width:0; }
  .alert-tag{
    display:inline-block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--green);
    background: rgba(127,166,107,0.12);
    border: 1px solid rgba(127,166,107,0.3);
    padding: 2px 9px;
    border-radius: 4px;
    margin-bottom: 7px;
  }
  .alert-title{
    font-size: 15.5px;
    color: var(--ink);
    text-decoration: none;
    display:block;
    margin-bottom: 5px;
  }
  .alert-title:hover{ color: var(--amber); }
  .alert-source{
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .empty{
    text-align:center;
    padding: 90px 20px;
    color: var(--ink-dim);
  }
  .empty .big{
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  footer{
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px 60px;
    color: var(--ink-dim);
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">개인 종목 알림 로그</div>
  <h1>내 종목 뉴스</h1>
  <p>텔레그램으로 전송된 알림을 시간순으로 모아봅니다. 신뢰 언론사 기사만 필터링해서 기록합니다.</p>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div id="content">
    <div class="empty"><div class="big">불러오는 중…</div></div>
  </div>
</main>

<footer id="footer"></footer>

<script>
let allAlerts = [];
let activeFilter = "전체";

function fmtDay(dateStr){
  try{
    const d = new Date(dateStr.replace(" ", "T"));
    const days = ['일','월','화','수','목','금','토'];
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`;
  }catch(e){ return dateStr; }
}
function fmtTime(dateStr){
  try{
    const d = new Date(dateStr.replace(" ", "T"));
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }catch(e){ return ""; }
}

function render(){
  const content = document.getElementById('content');
  const filtered = activeFilter === "전체" ? allAlerts : allAlerts.filter(a => a.stock === activeFilter);

  if(filtered.length === 0){
    content.innerHTML = `<div class="empty"><div class="big">아직 알림이 없어요</div>선택한 종목에 새 기사가 뜨면 여기 기록됩니다.</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(a => {
    const day = fmtDay(a.checked_at);
    if(!groups[day]) groups[day] = [];
    groups[day].push(a);
  });

  let html = "";
  for(const day of Object.keys(groups)){
    html += `<div class="day-group"><div class="day-label">${day}</div>`;
    groups[day].forEach(a => {
      html += `
        <div class="alert-item">
          <div class="alert-time">${fmtTime(a.checked_at)}</div>
          <div class="alert-body">
            <span class="alert-tag">${a.stock}</span>
            <a class="alert-title" href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
            <div class="alert-source">${a.source || ''}</div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  content.innerHTML = html;
}

function renderFilters(){
  const stocks = ["전체", ...new Set(allAlerts.map(a => a.stock))];
  const filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = stocks.map(s =>
    `<button class="chip ${s===activeFilter?'active':''}" data-stock="${s}">${s}</button>`
  ).join("");
  filtersEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.stock;
      renderFilters();
      render();
    });
  });
}

fetch('alerts.json?_=' + Date.now())
  .then(r => r.ok ? r.json() : [])
  .then(data => {
    allAlerts = data;
    document.getElementById('footer').textContent =
      `총 ${allAlerts.length}건 기록됨 · 15분마다 자동 갱신`;
    renderFilters();
    render();
  })
  .catch(() => {
    document.getElementById('content').innerHTML =
      `<div class="empty"><div class="big">데이터를 아직 불러올 수 없어요</div>자동화가 처음 실행되면 alerts.json이 생성됩니다.</div>`;
  });
</script>

</body>
</html>
