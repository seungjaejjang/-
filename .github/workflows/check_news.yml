name: Stock News Checker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_checker.py

      - name: Commit updated data
        run: |
          git config user.name "stock-news-bot"
          git config user.email "stock-news-bot@users.noreply.github.com"
          git add seen.json alerts.json
          git diff --staged --quiet || git commit -m "🔄 뉴스 데이터 업데이트 [skip ci]"
          git push
